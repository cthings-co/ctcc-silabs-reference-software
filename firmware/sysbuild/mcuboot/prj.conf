# Internal flash support
CONFIG_FLASH=y

# MCUboot serial recovery over UART
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_UART=y

# Wait for firmware updates during startup
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU=y
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU_TIMEOUT=5000

# Enable GPIO support for USART routing register access
CONFIG_GPIO=y

# No physical MCUboot recovery button is configured
CONFIG_BOOT_SERIAL_ENTRANCE_GPIO=n

# Increase stack space for MCUboot cryptographic operations
CONFIG_MAIN_STACK_SIZE=8192

# Remain in UART recovery when no valid application is found
CONFIG_BOOT_SERIAL_NO_APPLICATION=y

# Support firmware uploads to the secondary Flash slot
CONFIG_MCUBOOT_SERIAL_DIRECT_IMAGE_UPLOAD=y

# Support firmware activation and image-state management
CONFIG_BOOT_SERIAL_IMG_GRP_IMAGE_STATE=y

# Expose Flash slot information and MCUboot image-size limits
CONFIG_BOOT_SERIAL_IMG_GRP_SLOT_INFO=y
